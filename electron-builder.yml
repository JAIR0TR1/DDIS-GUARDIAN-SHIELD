appId: com.escudoguardian.app
productName: Escudo Guardián
copyright: Proyecto universitario · Diseño de Interfaces
directories:
  buildResources: build
  output: release
# Solo viaja lo compilado (out/) y package.json. Nada de claves, pruebas ni documentación.
files:
  - out/**
  - package.json
  - '!**/.vscode/*'
  - '!{.env,.env.*,.npmrc}'
asar: true
win:
  executableName: EscudoGuardian
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Escudo Guardián
  uninstallDisplayName: Escudo Guardián
  deleteAppDataOnUninstall: false
  artifactName: EscudoGuardian-${version}-setup.${ext}
  language: '3082'
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  notarize: false
npmRebuild: false
